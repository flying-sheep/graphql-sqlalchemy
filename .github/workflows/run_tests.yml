name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  run_tester:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "3.12", os: ubuntu-latest, python: "3.12" }
          - { name: "3.13", os: ubuntu-latest, python: "3.13" }
          - { name: "3.14", os: ubuntu-latest, python: "3.14" }
          - { name: "3.15", os: ubuntu-latest, python: "3.15" }

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.config.python }}
          cache: pip

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel codecov

      - name: Install Python package and dependencies
        run: pip install --group=test .

      - name: Run tests
        run: pytest --verbose --color=yes --cov=graphql_sqlalchemy --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
